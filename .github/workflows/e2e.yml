name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  playwright:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        id: e2e
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/e2e.log
      - name: Comment failures on PR
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## ❌ Playwright e2e failures'
            echo ''
            echo '```'
            # Failing test lines, expect() diffs, and error context.
            grep -nE '✘|✗|[0-9]+ failed|Error:|expect\(|Timed out|locator' /tmp/e2e.log | head -80 || true
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
